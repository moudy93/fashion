<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Image Recommender</title>
    <style>
      :root {
        --bg: #67819e;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: #ffffff;
        --text: #262646;
        --muted: #4c5f88;
        --accent: #6b82c0;
        --accent-dark: #3e3469;
        --border: rgba(51, 51, 109, 0.08);
        --shadow: 0 20px 60px rgba(11, 6, 78, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(192, 141, 107, 0.14),
            transparent 30%
          ),
          radial-gradient(
            circle at top right,
            rgba(157, 107, 77, 0.1),
            transparent 28%
          ),
          linear-gradient(180deg, #6898b4 0%, #f3ece7 100%);
        padding: 40px 20px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        background: var(--surface);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 36px;
        border-radius: 24px;
        border: 1px solid rgba(86, 140, 223, 0.57);
        box-shadow: var(--shadow);
      }

      h1 {
        text-align: center;
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3.2rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text);
      }

      h2 {
        text-align: center;
        margin: 0 0 28px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 34px;
        padding: 24px;
        border-radius: 20px;
        background: rgba(98, 164, 207, 0.55);
        border: 1px solid var(--border);
      }

      input[type="file"] {
        width: 100%;
        max-width: 420px;
        padding: 14px;
        border: 1px dashed rgba(31, 26, 23, 0.18);
        border-radius: 14px;
        background: #5db8c9;
        color: var(--muted);
        font-size: 15px;
        cursor: pointer;
      }

      input[type="file"]::file-selector-button {
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        margin-right: 14px;
        cursor: pointer;
        font-weight: 600;
      }

      button {
        background: linear-gradient(135deg, var(--text), #252857);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.04em;
        box-shadow: 0 10px 24px rgba(31, 26, 23, 0.18);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(100, 80, 190, 0.22);
        background: linear-gradient(135deg, var(--accent-dark), var(--text));
      }

      .preview,
      .results {
        margin-top: 24px;
      }

      .preview h2,
      .results h2 {
        text-align: left;
        margin-bottom: 14px;
        font-size: 1.1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .preview img {
        max-width: 280px;
        width: 100%;
        border-radius: 18px;
        border: 1px solid rgba(117, 165, 219, 0.08);
        box-shadow: 0 14px 30px rgba(31, 26, 23, 0.12);
        object-fit: cover;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 22px;
        margin-top: 18px;
      }

      .card {
        background: rgba(113, 160, 221, 0.8);
        border: 1px solid rgba(31, 26, 23, 0.08);
        border-radius: 20px;
        padding: 12px;
        text-align: center;
        box-shadow: 0 10px 26px rgba(40, 45, 77, 0.08);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 34px rgba(31, 26, 23, 0.14);
      }

      .card img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        border-radius: 14px;
      }

      .card p {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.02em;
        word-break: break-all;
      }

      @media (max-width: 768px) {
        .container {
          padding: 22px;
          border-radius: 18px;
        }

        form {
          padding: 18px;
        }

        .grid {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 16px;
        }

        .card img {
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Fashion Image Recommender</h1>
      <h2> click in choose file to upload an image for recommandation </h2>

      <form action="/" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required />
        <button type="submit">Get 5 Similar Images</button>
      </form>

      {% if uploaded %}
      <div class="preview">
        <h2>Uploaded Image</h2>
        <img src="{{ uploaded }}" alt="Uploaded Image" />
      </div>
      {% endif %} {% if results %}
      <div class="results">
        <h2>Top 5 Recommendations</h2>
        <div class="grid">
          {% for result in results %}
          <div class="card">
            <img src="{{ result.image }}" alt="Recommended Image" />
            <p>Cosine similarity: {{ result.score }}</p>
          </div>
          {% endfor %}
        </div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
